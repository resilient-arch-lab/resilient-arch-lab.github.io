  <path d="M72 134 V106 A28 28 0 0 1 128 106 V134" fill="none" stroke="#d6ac4a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M88 134 V108 A12 12 0 0 1 112 108 V134" fill="none" stroke="#f1dc9c" stroke-width="5" stroke-linejoin="round"/>
