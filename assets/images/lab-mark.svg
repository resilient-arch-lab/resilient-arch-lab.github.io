  <path d="M72 118 H50" stroke="#f1dc9c" stroke-width="3" stroke-linecap="round"/>
  <path d="M128 118 H150" stroke="#f1dc9c" stroke-width="3" stroke-linecap="round"/>
  <!-- keystone -->
  <circle cx="100" cy="78" r="4.5" fill="#f1dc9c" stroke="#14292f" stroke-width="2"/>
</svg>
